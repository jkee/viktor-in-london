<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viktor in London</title>
  <meta name="description" content="A personal map of London: where to live, scored by walking around — with the best coffee, food and stations layered on top.">
  <meta name="theme-color" content="#10069f">
  <link rel="canonical" href="https://viktor-in-london.uk/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Viktor in London">
  <meta property="og:title" content="Viktor in London">
  <meta property="og:description" content="A personal map of London: where to live, scored by walking around — with the best coffee, food and stations layered on top.">
  <meta property="og:url" content="https://viktor-in-london.uk/">
  <meta property="og:image" content="https://viktor-in-london.uk/img/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Map of central London with a teal liveability heat map and coffee, food and station badges">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="img/apple-touch-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
        integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <button class="panel-toggle" id="panel-toggle" aria-label="Toggle map controls"
          aria-expanded="false" aria-controls="panel">
    <svg class="mark mark--small" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="29.5" fill="none" stroke="#e21b22" stroke-width="14"/>
        <rect x="4.5" y="42.5" width="91" height="15" rx="2.8" fill="#1418a8"/>
        <text x="51" y="50.6" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" letter-spacing="2.2" fill="#fff" font-family="Hanken Grotesk, Arial, sans-serif">VIKTOR</text>
      </svg>
  </button>

  <button class="locate-btn" id="locate-btn" aria-label="Show my location" title="Show me">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
      <path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
  </button>

  <div class="toast" id="toast" role="status"></div>

  <div class="panel" id="panel">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="29.5" fill="none" stroke="#e21b22" stroke-width="14"/>
        <rect x="4.5" y="42.5" width="91" height="15" rx="2.8" fill="#1418a8"/>
        <text x="51" y="50.6" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="800" letter-spacing="2.2" fill="#fff" font-family="Hanken Grotesk, Arial, sans-serif">VIKTOR</text>
      </svg>
      <div class="brand-text">
        <h1>Viktor in London</h1>
        <div class="sub">where to live &middot; a personal map</div>
      </div>
    </div>

    <div class="rows">
      <label class="row">
        <input type="checkbox" id="toggle-livability" checked>
        <span class="txt">Heat map <span class="src"><a href="methodology.html">formula</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-coffee" checked>
        <span class="txt">Coffee <span class="src"><a href="https://propercoffee.app/london" target="_blank" rel="noopener">propercoffee</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-food">
        <span class="txt">Restaurants <span class="src"><a href="https://www.theinfatuation.com/london" target="_blank" rel="noopener">infatuation</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-tube">
        <span class="txt">Tube <span class="src"><a href="https://api.tfl.gov.uk" target="_blank" rel="noopener">tfl</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-wealth" checked>
        <span class="txt">Waitrose &amp; GAIL's <span class="src"><a href="methodology.html">store finders</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-newbuilds">
        <span class="txt">New-builds <span class="src"><a href="https://github.com/jkee/london-newbuilds" target="_blank" rel="noopener">research</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-crime">
        <span class="txt">Crime heat <span class="src"><a href="https://data.london.gov.uk/dataset/recorded_crime_summary" target="_blank" rel="noopener">met police</a></span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
      <label class="row">
        <input type="checkbox" id="toggle-markers">
        <span class="txt">Viktor's notes <span class="src">my walks</span></span>
        <span class="sw" aria-hidden="true"></span>
      </label>
    </div>

    <div class="divider"></div>

    <div class="legend">
      <span class="legend-label">quiet</span>
      <div class="legend-bar"></div>
      <span class="legend-label">great</span>
    </div>

    <div class="panel-links">
      <a class="about-link" href="about.html">about →</a>
      <a class="about-link" href="methodology.html">methodology →</a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
          integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin=""></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"
          integrity="sha384-4CB9Vtol9LN6lGgBCvmPLbUEZwilrqIvPieSRurgAXAB7FVJaLS9n8WyAIA5wjQ+" crossorigin=""></script>
  <script src="data/notes.js"></script>
  <script src="data/zone.js"></script>
  <script src="data/coffee-chains.js"></script>
  <script src="data/coffee-independents.js"></script>
  <script src="data/food.js"></script>
  <script src="data/stations.js"></script>
  <script src="data/wealth.js"></script>
  <script src="data/crime.js"></script>
  <script src="data/newbuilds.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
